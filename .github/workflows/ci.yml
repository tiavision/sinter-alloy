# Throwaway (branch webkit-url-check): the range test in WebKit, eight times, with sinter's fix (vendored tarball)
# and with released sinter, for the intermittent `$url` failure seen only on CI.
name: CI

on:
  push:

permissions:
  contents: read

jobs:
  range:
    name: range (${{ matrix.sinter }}, ${{ matrix.run }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sinter: [fix, released]
        run: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.sinter == 'released'
        run: npm install --no-save @tiaforge-ui/sinter@0.22.1
      - run: npx playwright install --with-deps webkit
      - run: npx vitest run test/browser.test.ts -t "range:" --silent=false
        env:
          BROWSER: webkit
          RANGE_DEBUG: '1'
