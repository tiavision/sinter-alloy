<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>@tiavision/sinter-alloy: a sortable list that saves its own order</title>
</head>
<body>
  <!-- A list from an API, kept sorted by `rank`. The component saves a drop itself: the moved row's rank goes between
       its new neighbours' at once (an optimistic layer of the page's store), then PUT /api/tasks/order { order: [...] };
       a refused request puts the row back and shows a note in the component. -->
  <sn-resource name="tasks" src="/api/tasks" key="id" order="rank" type="Task[]"></sn-resource>
  <main>
    <alloy-sortable data-sn-with="{ items: tasks, keyOf: (t) => t.id, nameOf: (t) => t.title, label: 'Tasks',
                                    resource: 'tasks', field: 'rank', save: '/api/tasks/order' }">
      <span slot="item" data-tm-grow data-sn-text="$slot.item.title"></span>
    </alloy-sortable>
  </main>
</body>
</html>
