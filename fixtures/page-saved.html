<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>@tiavision/sinter-alloy: a sortable list the page saves</title>
</head>
<body>
  <!-- The same list and API as index.html (self-saving), saved by the page instead: the component only emits `move`,
       and an action on its tag (sinter's actions on a component's tag, `$event` in the optimistic change) sends the
       order and moves the row at once; a refused request rolls the change back and the page shows its own note. -->
  <sn-resource name="tasks" src="/api/tasks" key="id" order="rank" type="Task[]"></sn-resource>
  <main data-sn-state="{ error: '' }">
    <alloy-sortable data-sn-with="{ items: tasks, keyOf: (t) => t.id, nameOf: (t) => t.title, label: 'Tasks' }"
                    data-sn-put="/api/tasks/order" data-sn-trigger="move"
                    data-sn-body="{ order: alloy.keysAfter(tasks, $event.detail, (t) => t.id) }"
                    data-sn-optimistic="merge(tasks.find((t) => t.id === $event.detail.key), { rank: alloy.between(tasks, $event.detail, 'rank') })"
                    data-sn-then="error = ''"
                    data-sn-catch="error = 'The new order could not be saved; the row is back where it was.'">
      <span slot="item" data-tm-grow data-sn-text="$slot.item.title"></span>
    </alloy-sortable>
    <template data-sn-if="error"><p role="alert" data-sn-text="error"></p></template>
  </main>
</body>
</html>
