<!--
  alloy-sortable: a list whose rows the user reorders, with a pointer (mouse, touch, pen) or the keyboard. Public.

  <alloy-sortable data-sn-with="{ items: names, keyOf: (n) => n, label: 'Names' }"
                  data-sn-on-move="names = alloy.reorder(names, $event.detail)">
    <span slot="item" data-tm-grow data-sn-text="$slot.item"></span>
  </alloy-sortable>

  The list renders in the first frame like the page's own markup: the rows are a data-sn-for over `items`, each row
  the app's `item` fill (it sees the page's scope and $slot.item, $slot.index). The component owns the row's frame
  only: a grip handle before the fill, and the row's look while it is moved.

  The page saves a drop: the component changes nothing itself. A drop emits `move` (a Move: key, from, to, the new
  neighbours' keys), and an action on the component's tag sends it, with an optimistic change that moves the row at
  once (sinter's actions on a component's tag; `$event.detail` is the Move):

  <sn-resource name="folders" src="/email/folders" key="folder_id" order="sort_order"></sn-resource>
  <alloy-sortable data-sn-with="{ items: folders, keyOf: (f) => f.folder_id, label: 'Folders' }"
                  data-sn-put="/email/folders/order" data-sn-trigger="move"
                  data-sn-body="{ order: alloy.keysAfter(folders, $event.detail, (f) => f.folder_id) }"
                  data-sn-optimistic="merge(folders.find((f) => f.folder_id === $event.detail.key),
                                            { sort_order: alloy.between(folders, $event.detail, 'sort_order') })"
                  data-sn-catch="failed = true">…</alloy-sortable>

  `alloy.between` is a value of the sort field between the new neighbours', so the store sorts the row into place;
  sinter sends the saves of quick moves one after another (an action's `data-sn-concurrency` is `queue`), and a
  refused one drops its optimistic layer (the row goes back): the page says so in its own alert line. The server's
  answer (renumbered) is written through with an OpenAPI spec; without one, `data-sn-then="refresh(folders)"`. Any
  API shape works the same way: the body is the page's. Until the page changes `items`, the row stays where it was; a
  live update from another tab (a server event re-sorting the resource) moves it like any other change.

  - items: the rows, in their order. keyOf: a row's key (unique, stable). nameOf: its name for the handle's label
    and the announcements (default: the key). label: the list's accessible name.
  - disabled: no handles, nothing moves (a pending save, a filtered list whose order means nothing).
  - quiet: the handles show on hover and focus only (on a touch screen they always show).
  - text: the words, for another language (SortableText; English by default).
  - The handle is a button: Space or Enter picks the row up, the arrow keys (Home, End) move it, Space or Enter drops
    it, Escape or leaving the list puts it back; each step is announced in the component's live region. A pointer
    drags from the handle (touch-action: none on it only, so the list still scrolls), the row follows the pointer,
    a line shows where it will drop, and the nearest scrolling box scrolls near its edges. Escape cancels a drag.

  The script (alloy-sortable.ts) writes only the component's state; the state machine is ../sortable.ts.
-->
<template data-sn-props="{ items: readonly any[]; keyOf: (item: any) => string; nameOf?: (item: any) => string; label: string; disabled?: boolean; quiet?: boolean; text?: Partial<SortableText>; item: Slot<{ item: any; index: number }> }" data-sn-emits="{ move: Move }">
  <div class="alloy-sortable" data-sn-state="{ lifted: '', via: '', dy: 0, lineKey: '', lineSide: '', status: '', instructions: '' }"
       data-sn-class="{ quiet: !!quiet, dragging: via === 'pointer' }">
    <ul role="list" data-tm-layout="stack" data-tm-gap="none" data-sn-attr="{ 'aria-label': label }">
      <template data-sn-for="(it, i) in items" data-sn-key="keyOf(it)">
        <li data-tm-layout="row" data-tm-gap="none" data-tm-wrap="none" data-tm-align="center"
            data-sn-let="{ k: keyOf(it), name: nameOf ? nameOf(it) : keyOf(it) }"
            data-sn-attr="{ 'data-al-key': k, 'data-al-lifted': lifted === k ? via : null, 'data-tm-lifted': lifted === k ? '' : null, 'data-tm-drop': lineKey === k ? lineSide : null }"
            data-sn-style="{ '--al-dy': lifted === k && via === 'pointer' ? dy + 'px' : null }">
          <template data-sn-if="!disabled">
            <button type="button" class="al-handle" data-tm-size="sm"
                    data-sn-attr="{ 'data-tm-handle': quiet ? 'quiet' : '', 'aria-label': text?.handle ? text.handle(name) : 'Move ' + name, 'aria-description': instructions, 'aria-pressed': lifted === k ? 'true' : 'false' }"></button>
          </template>
          <slot name="item" data-sn-with="{ item: it, index: i }"><span data-tm-grow data-tm-truncate data-sn-text="name"></span></slot>
        </li>
      </template>
    </ul>
    <div class="al-status" data-tm-sr-only role="status" data-sn-text="status"></div>
  </div>
</template>
<style>
  /* temper draws the handle (data-tm-handle), the lifted row (data-tm-lifted) and the drop line (data-tm-drop) */
  li { border-radius: var(--tm-radius); }
  .dragging, .dragging * { cursor: grabbing; user-select: none; }
  li[data-al-lifted='pointer'] { transform: translateY(var(--al-dy, 0)); }
  @media (prefers-reduced-motion: no-preference) {
    li { transition: box-shadow var(--tm-duration) var(--tm-ease); }
  }
</style>
