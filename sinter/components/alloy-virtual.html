<!--
  alloy-virtual: a long list that renders only the rows in view. Public.

  <sn-resource name="contacts" src="/contacts" key="id" paginate="{ append: { after: $item.id }, size: 100 }"></sn-resource>
  <alloy-virtual data-sn-with="{ items: contacts, keyOf: (c) => c.id, label: 'Contacts', estimate: 48, total: $meta.contacts.total }"
                 data-sn-on-end="page(contacts, 'next')">
    <contact-row slot="item" data-sn-with="{ contact: $slot.item }"></contact-row>
  </alloy-virtual>

  It reuses sinter's pagination rather than bringing its own: a resource paginated with `append` (the "load more" mode:
  every loaded page stays in the list, the cursor and parameters are the API's) is the list, and `end`, emitted when
  the rows in view reach the last loaded ones, is the page's `page(list, 'next')` (which does nothing once there is no
  next page). The component renders the rows in view and a few around them; two spacers stand for the rest, sized from
  the rows' measured heights (for those not shown yet: the average of those measured, `estimate` before any), so the
  scrollbar is right. It is the scrolling box: give it a height (its box's, by default 100%).

  Scrolling costs little: the rows are measured by a ResizeObserver (no layout forced from script), and the rows
  rendered move only when the view comes within half the overscan of their edge, so a slow scroll renders every few
  rows, not every frame. A page may pass a new `keyOf` function at every render; only a new `items` array counts.

  Before reaching for it: temper's `data-tm-lazy` (CSS content-visibility) keeps every row in the page, so find in page and
  the browser's own keys work, and is enough up to a few thousand rows. alloy-virtual is for more than that.

  - items, keyOf: the rows and their key. label: the list's accessible name. total: the whole list's size where the
    server says it ($meta.<name>.total), for aria-setsize (else the rows loaded).
  - estimate: a row's height before any is measured (48 px). overscan: rows rendered beyond the view on each side (8).
  - slot item ($slot.item, $slot.index): a row. event end: the view reached the last loaded rows.
  - Keys: the list is focusable and scrolls with the browser's keys; rows are role="listitem" with aria-posinset.
-->
<template data-sn-props="{ items: readonly any[]; keyOf: (item: any) => string; label: string; total?: number | null; estimate?: number; overscan?: number; item: Slot<{ item: any; index: number }> }" data-sn-emits="{ end: number }">
  <div class="alloy-virtual" role="list" tabindex="0" data-sn-attr="{ 'aria-label': label }"
       data-sn-state="{ start: 0, end: 24, top: 0, bottom: -1 }">
    <div class="al-spacer" aria-hidden="true" data-sn-style="{ 'block-size': top ? top + 'px' : null }"></div>
    <template data-sn-for="(it, i) in items.slice(start, end)" data-sn-key="keyOf(it)">
      <div role="listitem" data-sn-attr="{ 'data-al-index': start + i, 'aria-posinset': start + i + 1, 'aria-setsize': total ?? items.length }">
        <slot name="item" data-sn-with="{ item: it, index: start + i }"><span data-sn-text="keyOf(it)"></span></slot>
      </div>
    </template>
    <div class="al-spacer" aria-hidden="true" data-sn-style="{ 'block-size': bottom < 0 ? Math.max(0, items.length - end) * (estimate ?? 48) + 'px' : bottom ? bottom + 'px' : null }"></div>
  </div>
</template>
<style>
  .alloy-virtual { block-size: 100%; overflow-y: auto; overflow-anchor: none; contain: strict; color: var(--tm-text); }
  .alloy-virtual:focus-visible { outline: 2px solid var(--tm-accent); outline-offset: -2px; }
  .al-spacer { flex: none; }
</style>
