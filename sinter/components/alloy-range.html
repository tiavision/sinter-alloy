<!--
  alloy-range: a range of dates picked in one calendar, with presets. Public.

  <alloy-range data-sn-with="{ params: ['start', 'end'], start: $url.start, end: $url.end, label: 'Period' }"></alloy-range>

  The assumed shape is the URL's: with `params`, a picked range is written to those two query parameters as ISO dates
  (sinter's navigate(): a history entry, the page stays and its resources that read them reload), and '' removes them.
  Without `params`, the page applies the `change` event ({ start, end }) itself.

  The button shows the range in the page's language ("10 Nov 2026 – 16 Nov 2026") and opens the calendar (a popover):
  the first day picked starts the range, the second ends it (an earlier day becomes the start), the days between are
  filled as the pointer moves; the presets (last 7 days, last 30 days, this month, last month) pick a whole range; Clear
  removes it.

  - start, end: the range shown (ISO or ''); label: its accessible name; min, max, marks as <alloy-date>'s.
  - params: [startName, endName], the URL's parameters. text: the words (RangeText; English by default).
-->
<template data-sn-props="{ start?: string | null; end?: string | null; label: string; params?: readonly [string, string]; min?: string; max?: string; marks?: readonly string[]; text?: Partial<RangeText> }" data-sn-emits="{ change: DateRange }">
  <div class="alloy-range" data-sn-state="{ open: false, today: '', first: '' }">
    <button type="button" data-variant="outline" data-icon="calendar" data-sn-ref="toggle"
            data-sn-attr="{ 'aria-expanded': open ? 'true' : 'false', 'aria-haspopup': 'dialog', 'aria-label': label + ': ' + (start && end ? date(start, 'medium') + ' – ' + date(end, 'medium') : (text?.placeholder ?? 'Any time')) }"
            data-sn-text="start && end ? date(start, 'medium') + ' – ' + date(end, 'medium') : (text?.placeholder ?? 'Any time')"></button>
    <div popover data-menu class="al-popover" role="dialog" data-sn-ref="popover" data-sn-attr="{ 'aria-label': label }">
      <div data-layout="row" data-gap="md" data-align="start">
        <div class="al-presets" data-layout="stack" data-gap="xs">
          <button type="button" data-variant="ghost" data-size="sm" data-al-preset="last7" data-sn-text="text?.last7 ?? 'Last 7 days'"></button>
          <button type="button" data-variant="ghost" data-size="sm" data-al-preset="last30" data-sn-text="text?.last30 ?? 'Last 30 days'"></button>
          <button type="button" data-variant="ghost" data-size="sm" data-al-preset="month" data-sn-text="text?.month ?? 'This month'"></button>
          <button type="button" data-variant="ghost" data-size="sm" data-al-preset="lastMonth" data-sn-text="text?.lastMonth ?? 'Last month'"></button>
          <button type="button" data-variant="ghost" data-size="sm" data-al-preset="clear" data-sn-text="text?.clear ?? 'Clear'"></button>
        </div>
        <div data-layout="stack" data-gap="xs">
          <template data-sn-if="today">
            <alloy-calendar data-sn-with="{ locale: $locale, today, start: first || start || undefined, end: first ? undefined : (end || undefined), min, max, marks, prev: text?.prev ?? 'Previous month', next: text?.next ?? 'Next month' }"></alloy-calendar>
          </template>
          <span class="al-hint" data-caption role="status" data-sn-text="first ? (text?.pickEnd ?? 'Now pick the last day') : ''"></span>
        </div>
      </div>
    </div>
  </div>
</template>
<style>
  .al-popover { padding: var(--tm-space-sm); }
  .al-presets > button { justify-content: flex-start; }
  .al-hint { min-block-size: 1lh; text-align: center; }
</style>
