<!--
  alloy-palette: a command palette, opened with Ctrl+K (⌘K on a Mac) or its button. Public.

  <alloy-palette data-sn-with="{ src: '/api/search/commands', label: 'Commands' }"></alloy-palette>

  It needs no setup: it lists the page's own commands, every link of its navigation (`nav a[href]`, "Go to") and every
  button with a shortcut (`data-shortcut`, `aria-keyshortcuts`, "Actions"), as they are when it opens. A page adds its
  own (`commands`), and with `src` it asks the server as the user types, the assumed shape:

    GET <src>?q=<text>   →   [{ "id", "label", "href"?, "group"?, "keywords"?, "shortcut"? }]

  through sinter's request layer, after a 150 ms pause, the latest answer winning. Typing ranks the commands (every word
  must match: at the start of a label, of a word, inside it, or as an abbreviation); an empty field shows the recently
  picked ones first (kept in localStorage). Picking one follows its link (sinter's navigate()), clicks the page's button
  it came from, or emits `pick` for a page's own command; the palette closes and the focus goes back where it was.

  - label: the dialog's accessible name. commands, src: above. keys: the shortcut, 'mod+k' (default) or false for none.
  - text: the words (PaletteText). Keys: the arrows move through the list (sinter's data-sn-options: a combobox),
    Enter picks, Escape closes.
-->
<template data-sn-props="{ label: string; src?: string; commands?: readonly PaletteCommand[]; keys?: 'mod+k' | false; text?: Partial<PaletteText> }" data-sn-emits="{ pick: PaletteCommand }">
  <div class="alloy-palette" data-sn-state="{ q: '', results: /** @type {{ id: string; label: string; group?: string; keywords?: string; href?: string; shortcut?: string }[]} */ ([]), loading: false, mac: false }">
    <button type="button" data-tm-variant="outline" data-tm-icon="search" data-sn-ref="open"
            data-sn-attr="{ 'aria-keyshortcuts': keys === false ? null : (mac ? 'Meta+K' : 'Control+K') }">
      <span data-sn-text="text?.open ?? 'Search commands'"></span>
      <template data-sn-if="keys !== false"><kbd data-sn-text="mac ? '⌘K' : 'Ctrl K'"></kbd></template>
    </button>
    <dialog class="al-dialog" data-tm-sheet="top" data-sn-ref="dialog" data-sn-attr="{ 'aria-label': label }">
      <div data-tm-layout="stack" data-tm-gap="sm">
        <div data-tm-field>
          <span data-tm-icon="search" aria-hidden="true"></span>
          <input type="text" autocomplete="off" spellcheck="false" data-sn-ref="field" data-sn-options="alloy-palette-list"
                 data-sn-model="q" data-sn-attr="{ 'aria-label': label, placeholder: text?.placeholder ?? 'Type a command or search' }">
        </div>
        <ul id="alloy-palette-list" role="listbox" data-tm-layout="stack" data-tm-gap="none" data-sn-attr="{ 'aria-label': label, 'aria-busy': loading ? 'true' : null }">
          <template data-sn-for="(r, i) in results" data-sn-key="r.id">
            <li role="option" data-tm-layout="row" data-tm-gap="sm" data-tm-align="center" data-tm-wrap="none" data-tm-pad="xs"
                data-sn-on-click="emit('pick', r)">
              <span data-tm-icon="chevron-right" aria-hidden="true"></span>
              <span data-tm-grow data-tm-truncate data-sn-text="r.label"></span>
              <template data-sn-if="r.shortcut"><kbd data-sn-text="r.shortcut"></kbd></template>
              <span class="al-group" data-tm-caption data-sn-text="i === 0 || results[i - 1]?.group !== r.group ? (r.group ?? '') : ''"></span>
            </li>
          </template>
        </ul>
        <template data-sn-if="!results.length && !loading"><p data-tm-muted data-tm-pad="xs" data-sn-text="text?.empty ?? 'Nothing found'"></p></template>
      </div>
    </dialog>
  </div>
</template>
<style>
  /* temper: the dialog along the top edge (data-tm-sheet="top"), the options' look in a listbox */
  .al-dialog { --tm-dialog-width: 36rem; }
  ul { max-block-size: min(24rem, 60vh); overflow: auto; }
  li[data-sn-marked] { background: var(--tm-fill); }
  .al-group { min-inline-size: 6rem; text-align: end; }
  kbd { flex: none; }
</style>
